# Ablation — Tiers 1–3 (deterministic + template + evidence-guided).
# Tier 4 (dynamic capture) is disabled so NASE/TSVM get no dynamic remediation.
llm:
  base_url: "<OPENAI_COMPATIBLE_ENDPOINT>"
  api_key: "${LLM_API_KEY}"
  model: "openai/gpt-oss-20b"
  temperature: 0.2
  top_p: 0.9
  max_tokens: 2048

pipeline:
  tiers_enabled: [1, 2, 3]
  validator_gates: [1, 2, 3, 4, 5, 6, 7]
