name: segtr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - openai>=1.40          # OpenAI-compatible client; endpoint configurable
    - pyyaml>=6.0
    - pydantic>=2
    - javalang>=0.13        # Java source AST for operator validation
    - lxml>=5.0             # JaCoCo XML parsing
    - tqdm
    - numpy
    - pandas                # only used for post-hoc analysis scripts
