[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-smelly-repair"
version = "0.1.0"
description = "LLM-driven repair/refactoring of EvoSuite-generated JUnit4 tests using Smelly warnings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31.0"]

# The pipeline sources import the package as `smell_repair_v2` (the development
# tree's name), while this repository ships it under `src/segtr/`. Map the two so
# the package is importable; no source file is moved or modified.
[tool.setuptools]
package-dir = {"smell_repair_v2" = "src/segtr"}
packages = [
    "smell_repair_v2",
    "smell_repair_v2.analysis",
    "smell_repair_v2.config",
    "smell_repair_v2.config.tests",
    "smell_repair_v2.coverage",
    "smell_repair_v2.dynamic",
    "smell_repair_v2.dynamic.tests",
    "smell_repair_v2.llm",
    "smell_repair_v2.llm.fewshot",
    "smell_repair_v2.llm.tests",
    "smell_repair_v2.operators",
    "smell_repair_v2.operators.tests",
    "smell_repair_v2.project",
    "smell_repair_v2.rules",
    "smell_repair_v2.scripts",
    "smell_repair_v2.scripts.tests",
    "smell_repair_v2.tiers",
    "smell_repair_v2.tiers.tests",
    "smell_repair_v2.utils",
]
